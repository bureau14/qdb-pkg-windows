agents:
  queue: "{queue}"

label: "{name}"
step_id: package

commands:
  - echo "+++ Sign packages"
  - powershell -file qdb-code-signing\windows_package_sign.ps1
  - echo "+++ Build installer"
  - powershell -file scripts\cicd\build_installer.ps1
  - echo "+++ Sign installer"
  - powershell -file qdb-code-signing\windows_installer_sign.ps1
  - echo "+++ Verify signature"
  - powershell -file scripts\cicd\verify_signature.ps1 -Path *.exe


plugins:
  - bureau14/qdb-artifacts#sc-20192/snapshot-dependencies:
      download:
        projects:
          - project_id: "qdb-pkg-archives"
            step: [api, server, utils, rest, odbc]
            files:
              - "*.zip"
            exclude:
              - "*nats*.zip"
            output-dir: .
          - project_id: "qdb-code-signing"
            latest: true
            step: build
            clean: true
            files:
              - "qdb-code-signing.tar.gz"
            extract: true
            output-dir: qdb-code-signing
      upload:
        files:
        - "*.exe"
      promote: {}
